[project]
name = "cubic-exp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "diffusers>=0.37.1",
    "easydict>=1.13",
    "einops>=0.8.2",
    "flash-attn==2.8.3",
    "ftfy>=6.3.1",
    "hf-xet>=1.4.3",
    "huggingface-hub>=1.9.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib==3.10.6",
    "opencv-python>=4.13.0.92",
    "peft>=0.18.1",
    "safetensors>=0.7.0",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    # 如果你有 torchvision，也一并写上
    "torchvision==0.23.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
# 如果有 torchvision：
# torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = [
    "packaging",
    "psutil",
    "ninja",
    { requirement = "torch", match-runtime = true }
]